kind = "mobile"
previewPath = "/"
title = "Namib Battle Royale"
version = "1.0.0"
id = "artifacts/nbr-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22903

[services.development]
run = "pnpm --filter @workspace/nbr-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nbr-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/nbr-mobile", "run", "serve" ]

[services.env]
PORT = "22903"
BASE_PATH = "/"
